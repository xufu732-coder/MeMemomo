<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メモ帳">
<meta name="theme-color" content="#3E5C55">
<style>
  :root{
    --bg:#F7F6F3; --card:#FFFFFF; --border:#E4E1DA; --ink:#2B2A28;
    --muted:#8B887F; --accent:#3E5C55; --accent-soft:#E8EEEC; --danger:#B3543E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Roboto,sans-serif;
    overscroll-behavior-y:contain;
  }
  header{
    display:flex; align-items:center; gap:8px; padding:14px 16px 10px;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header h1{font-size:18px; font-weight:600; margin:0; flex:1; letter-spacing:.02em;}
  header button{
    border:none; background:transparent; color:var(--accent); font-size:14px;
    font-weight:600; padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  header button:active{background:var(--accent-soft);}
  #backBtn{color:var(--muted); font-weight:500;}
  #addBtn{font-size:22px; line-height:1; padding:4px 10px;}
  #selectBar{
    display:flex; align-items:center; gap:8px; padding:8px 16px;
    background:var(--accent-soft); position:sticky; top:52px; z-index:4;
  }
  #selectBar span{flex:1; font-size:13px; color:var(--accent);}
  #selectBar button{border:none; background:var(--card); color:var(--accent);
    font-size:13px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer;}
  #groupBtn{background:var(--accent); color:#fff;}
  #list{padding:6px 12px 40px; display:flex; flex-direction:column; gap:8px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; gap:10px;
    min-height:56px; touch-action:pan-y; user-select:none;
  }
  .card.dragging{box-shadow:0 6px 16px rgba(0,0,0,.12); opacity:.95;}
  .card .check{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--border);
    flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
  }
  .card .check.on{background:var(--accent); border-color:var(--accent);}
  .card .icon{font-size:20px; flex:none; width:22px; text-align:center;}
  .card .txt{flex:1; min-width:0;}
  .card .title{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; margin-top:60px; line-height:1.8;}
  .overlay{
    position:fixed; inset:0; background:rgba(30,28,24,.35); display:flex;
    align-items:flex-end; z-index:10;
  }
  .sheet{
    background:var(--card); width:100%; max-height:88vh; border-radius:16px 16px 0 0;
    display:flex; flex-direction:column; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .sheet input{
    border:none; font-size:17px; font-weight:600; padding:8px 2px; outline:none; color:var(--ink);
  }
  .sheet textarea{
    border:none; outline:none; font-size:14px; color:var(--ink); resize:none;
    flex:1; min-height:40vh; padding:8px 2px; font-family:inherit; line-height:1.7;
  }
  .sheet-actions{display:flex; justify-content:space-between; padding-top:8px; border-top:1px solid var(--border);}
  .sheet-actions button{
    border:none; background:transparent; font-size:14px; font-weight:600; padding:10px 12px; border-radius:8px;
  }
  #deleteBtn{color:var(--danger);}
  #saveBtn{color:#fff; background:var(--accent);}
</style>
</head>
<body>
<header>
  <button id="backBtn" style="display:none">← 戻る</button>
  <h1 id="pageTitle">メモ帳</h1>
  <button id="selectBtn">選択</button>
  <button id="addBtn">＋</button>
</header>
<div id="selectBar" style="display:none">
  <span id="selectCount">0件選択中</span>
  <button id="groupBtn">フォルダにまとめる</button>
  <button id="cancelSelectBtn">キャンセル</button>
</div>
<div id="list"></div>

<div id="overlay" class="overlay" style="display:none">
  <div class="sheet">
    <input id="editTitle" placeholder="タイトル">
    <textarea id="editContent" placeholder="内容を入力"></textarea>
    <div class="sheet-actions">
      <button id="deleteBtn">削除</button>
      <button id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'memoAppData_v1';
let data = load();
let currentFolder = null;      // id of folder currently viewing, or null for root
let selectMode = false;
let selected = new Set();
let editId = null;             // id being edited, null = creating new
let dragActive = false;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { items:{}, rootOrder:[] };
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch(e){ console.error('保存に失敗しました', e); }
}
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }

function getOrder(){
  return currentFolder ? data.items[currentFolder].childOrder : data.rootOrder;
}
function setOrder(arr){
  if(currentFolder) data.items[currentFolder].childOrder = arr;
  else data.rootOrder = arr;
}

function render(){
  document.getElementById('backBtn').style.display = currentFolder ? '' : 'none';
  document.getElementById('pageTitle').textContent = currentFolder ? data.items[currentFolder].title : 'メモ帳';
  const list = document.getElementById('list');
  list.innerHTML = '';
  const order = getOrder();
  if(order.length===0){
    list.innerHTML = '<div class="empty">まだメモがありません<br>右上の ＋ から作成できます</div>';
    return;
  }
  order.forEach(id=>{
    const item = data.items[id];
    if(!item) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = id;

    if(selectMode){
      const chk = document.createElement('div');
      chk.className = 'check' + (selected.has(id) ? ' on' : '');
      chk.textContent = selected.has(id) ? '✓' : '';
      card.appendChild(chk);
    }
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = item.type==='folder' ? '📁' : '📝';
    card.appendChild(icon);

    const txt = document.createElement('div');
    txt.className = 'txt';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = item.title || '(無題)';
    txt.appendChild(title);
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = item.type==='folder'
      ? (item.childOrder.length + '件のメモ')
      : (item.content || '').split('\n')[0];
    txt.appendChild(sub);
    card.appendChild(txt);

    attachInteractions(card, id, item);
    list.appendChild(card);
  });
}

function attachInteractions(card, id, item){
  card.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    const startX=e.clientX, startY=e.clientY;
    let moved = false; // pointer travelled beyond the tap threshold
    // Reordering by long-press is only meaningful outside select mode.
    const timer = selectMode ? null : setTimeout(()=>{
      if(!moved) startDrag(e, card, id);
    }, 380);
    const onMove = (ev)=>{
      if(Math.abs(ev.clientX-startX)>10 || Math.abs(ev.clientY-startY)>10){
        moved = true;
        if(timer) clearTimeout(timer);
      }
    };
    const onUp = ()=>{
      if(timer) clearTimeout(timer);
      card.removeEventListener('pointermove', onMove);
      card.removeEventListener('pointerup', onUp);
      if(!dragActive && !moved){
        handleTap(id, item);
      }
    };
    card.addEventListener('pointermove', onMove);
    card.addEventListener('pointerup', onUp, {once:true});
  });
}

function startDrag(e, card, id){
  dragActive = true;
  try{ card.setPointerCapture(e.pointerId); }catch(err){}
  card.classList.add('dragging');
  const list = document.getElementById('list');
  const onMove = (ev)=>{
    const y = ev.clientY;
    const siblings = [...list.children].filter(c=>c!==card && c.dataset.id);
    let placed=false;
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(y < r.top + r.height/2){ list.insertBefore(card, sib); placed=true; break; }
    }
    if(!placed) list.appendChild(card);
  };
  const onUp = (ev)=>{
    card.classList.remove('dragging');
    card.removeEventListener('pointermove', onMove);
    card.removeEventListener('pointerup', onUp);
    try{ card.releasePointerCapture(e.pointerId); }catch(err){}
    const newOrder = [...list.children].map(c=>c.dataset.id).filter(Boolean);
    setOrder(newOrder);
    save();
    setTimeout(()=>{ dragActive=false; }, 60);
  };
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerup', onUp, {once:true});
}

function handleTap(id, item){
  if(selectMode){
    if(item.type==='folder') return; // フォルダはまとめ対象外
    if(selected.has(id)) selected.delete(id); else selected.add(id);
    updateSelectBar();
    render();
    return;
  }
  if(item.type==='folder'){
    currentFolder = id;
    render();
  }else{
    openEditor(id);
  }
}

function updateSelectBar(){
  document.getElementById('selectCount').textContent = selected.size + '件選択中';
}

function openEditor(id){
  editId = id;
  const item = id ? data.items[id] : null;
  document.getElementById('editTitle').value = item ? item.title : '';
  document.getElementById('editContent').value = item ? item.content : '';
  document.getElementById('deleteBtn').style.display = item ? '' : 'none';
  document.getElementById('overlay').style.display = 'flex';
  setTimeout(()=>document.getElementById('editTitle').focus(), 50);
}
function closeEditor(){
  document.getElementById('overlay').style.display = 'none';
  editId = null;
}

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const title = document.getElementById('editTitle').value.trim() || '(無題)';
  const content = document.getElementById('editContent').value;
  if(editId){
    data.items[editId].title = title;
    data.items[editId].content = content;
  }else{
    const id = uid();
    data.items[id] = { id, type:'note', title, content };
    getOrder().push(id);
  }
  save();
  closeEditor();
  render();
});
document.getElementById('deleteBtn').addEventListener('click', ()=>{
  if(!editId) return;
  if(!confirm('このメモを削除しますか？')) return;
  setOrder(getOrder().filter(x=>x!==editId));
  delete data.items[editId];
  save();
  closeEditor();
  render();
});
document.getElementById('addBtn').addEventListener('click', ()=> openEditor(null));
document.getElementById('backBtn').addEventListener('click', ()=>{ currentFolder=null; render(); });

document.getElementById('selectBtn').addEventListener('click', ()=>{
  selectMode = true;
  selected = new Set();
  document.getElementById('selectBar').style.display = 'flex';
  updateSelectBar();
  render();
});
document.getElementById('cancelSelectBtn').addEventListener('click', exitSelectMode);
function exitSelectMode(){
  selectMode = false;
  selected = new Set();
  document.getElementById('selectBar').style.display = 'none';
  render();
}
document.getElementById('groupBtn').addEventListener('click', ()=>{
  if(selected.size===0){ alert('まとめるメモを選んでください'); return; }
  const name = prompt('フォルダ名を入力してください', 'フォルダ');
  if(name===null) return;
  const folderId = uid();
  const ids = [...selected];
  data.items[folderId] = { id:folderId, type:'folder', title:name.trim() || 'フォルダ', childOrder: ids };
  setOrder(getOrder().filter(id=>!selected.has(id)));
  getOrder().push(folderId);
  save();
  exitSelectMode();
});

document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeEditor();
});

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
